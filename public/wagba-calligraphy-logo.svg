<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flame Icon & Grill Mark Emblem -->
  <g transform="translate(18, 14)">
    <circle cx="36" cy="36" r="32" fill="#24140D" stroke="#D97706" stroke-width="2.5" />
    <path d="M36 12 C30 22, 20 28, 26 44 C28 50, 32 54, 36 56 C40 54, 44 50, 46 44 C52 28, 42 22, 36 12 Z" fill="url(#flameGrad)" />
    <path d="M36 24 C32 30, 28 35, 32 44 C34 48, 36 50, 36 50 C36 50, 38 48, 40 44 C44 35, 40 30, 36 24 Z" fill="#FBBF24" />
    <!-- Grill Sparks -->
    <circle cx="22" cy="24" r="1.5" fill="#F59E0B" />
    <circle cx="49" cy="22" r="1.5" fill="#F59E0B" />
    <circle cx="53" cy="34" r="1.2" fill="#DC2626" />
  </g>

  <!-- Main Arabic Calligraphy Text: الوجبة الشهية -->
  <text x="100" y="52" font-family="'Cairo', 'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="40" font-weight="900" fill="#24140D" letter-spacing="0.5">
    الوجبة الشهية
  </text>

  <!-- Accent Swash Underline -->
  <path d="M100 62 Q 220 70, 390 62" stroke="url(#flameGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="390" cy="62" r="3.5" fill="#DC2626" />
  <circle cx="100" cy="62" r="3.5" fill="#D97706" />

  <!-- Subtitle: مشويات وشاورما على أصولها - 6 أكتوبر -->
  <text x="102" y="82" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#8C5329" letter-spacing="1.2">
    مشويات الشواية • صواني العيلة • شاورما سوري
  </text>
</svg>
