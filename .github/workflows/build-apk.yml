name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK & Prepare Asset
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/elwagba-elshahia.apk
          mkdir -p public/downloads
          cp dist-apk/elwagba-elshahia.apk public/downloads/elwagba-elshahia.apk
          ls -lh dist-apk/elwagba-elshahia.apk

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log
          tail -n 300 gradle-build.log > gradle-error.txt || true
          git add gradle-error.txt
          git commit -m "chore: upload gradle error log" || true
          git push origin build-log -f || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elwagba-elshahia-apk
          path: dist-apk/elwagba-elshahia.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "مطعم الوجبة الشهية - تطبيق الأندرويد الرسمي v1.0.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🍗 تطبيق مطعم الوجبة الشهية للأندرويد - النسخة الأصلية الرسمية v1.0.0
            
            أهلاً بكم في تطبيق **مطعم الوجبة الشهية** الرسمي للأندرويد - فرع 6 أكتوبر (الحي الثاني - شارع جيل 2000)!
            
            ### 🔥 مميزات التطبيق:
            - تجربة طلب تيك أواي، دليفري، وصالة سريعة ومباشرة لكافة أحياء 6 أكتوبر والشيخ زايد.
            - متابعة لحظية لحالة الأوردر خطوة بخطوة مع إشعارات وتنبيهات صوتية فورية.
            - قائمة الطعام الكاملة: مشويات الشواية على الفحم، صواني اللمة والعيلة، الشاورما السوري المحمصة، الفاهيتا، والبروستد والكرسبي.
            - عروض الأسبوع الحصرية (الثلاثاء والأربعاء والخميس) مع أسعار وعروض مخفضة تلقائياً.
            - شات آمن ومباشر بين العميل وإدارة المطعم.
            
            ### 📥 طريقة التثبيت:
            1. اضغط على رابط التحميل المباشر بالأسفل `elwagba-elshahia.apk`.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. إذا ظهرت رسالة الأمان في هاتفك، اختر **السماح بالتثبيت من هذا المصدر**.
            4. افتح التطبيق واستمتع بأشهى وجبة بأعلى جودة وطعم بيحبه قلبك!
          files: dist-apk/elwagba-elshahia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK to Repo
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/elwagba-elshahia.apk
          git commit -m "chore(release): host genuine compiled Al Wagba APK [skip ci]" || echo "No changes"
          git push origin main || true
